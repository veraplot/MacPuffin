name: Release

# Tag a version to publish it:
#   git tag v1.0.0 && git push origin v1.0.0
#
# The DMG is attached to the GitHub release, which is what makes
# /releases/latest/download/MacPuffin.dmg a stable link.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  dmg:
    name: Build and publish the DMG
    runs-on: macos-latest

    # The `secrets` context cannot be read from a step-level `if`, so the values
    # are mapped to env here and the conditions below test these instead.
    # Without this every signing step silently skips, and an unsigned build gets
    # published looking exactly like a signed one.
    env:
      HAS_CERT: ${{ secrets.MACOS_CERT_P12 != '' }}
      HAS_NOTARY: ${{ secrets.MACOS_NOTARY_PROFILE != '' }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run the test suite before shipping anything
        run: npm run test:coverage

      # With the certificate secrets set, the release is signed and notarised
      # and opens on a double-click. Without them the build still happens,
      # ad-hoc signed, and users approve it once in System Settings.
      - name: Import the Developer ID certificate
        if: env.HAS_CERT == 'true'
        env:
          CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          echo "$CERT_P12" | base64 --decode > /tmp/cert.p12
          security create-keychain -p actions build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p actions build.keychain
          security set-keychain-settings -t 3600 -u build.keychain
          security import /tmp/cert.p12 -k build.keychain -P "$CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k actions build.keychain >/dev/null
          rm -f /tmp/cert.p12

          IDENTITY=$(security find-identity -v -p codesigning build.keychain \
            | grep 'Developer ID Application' | head -1 | sed -E 's/.*"(.*)"/\1/')
          if [ -z "$IDENTITY" ]; then
            echo "The imported certificate is not a Developer ID Application one."
            echo "Apple Development certificates cannot be notarised."
            security find-identity -v -p codesigning build.keychain
            exit 1
          fi
          echo "SIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
          echo "signing as: $IDENTITY"

      - name: Store the notary credentials
        if: env.HAS_NOTARY == 'true'
        env:
          APPLE_ID: ${{ secrets.MACOS_NOTARY_APPLE_ID }}
          TEAM_ID: ${{ secrets.MACOS_NOTARY_TEAM_ID }}
          APP_PASSWORD: ${{ secrets.MACOS_NOTARY_PASSWORD }}
          PROFILE: ${{ secrets.MACOS_NOTARY_PROFILE }}
        run: |
          xcrun notarytool store-credentials "$PROFILE" \
            --apple-id "$APPLE_ID" --team-id "$TEAM_ID" --password "$APP_PASSWORD"

      # make-dmg.sh reads SIGN_IDENTITY and NOTARY_PROFILE: it builds the app,
      # signs every nested binary, packages the image, then submits and staples.
      - name: Build the disk image
        env:
          NOTARY_PROFILE: ${{ secrets.MACOS_NOTARY_PROFILE }}
        run: ./make-dmg.sh "$RUNNER_TEMP/dist"

      - name: Verify the packaged app is universal, signed and runnable
        run: |
          MNT=$(hdiutil attach "$RUNNER_TEMP/dist/MacPuffin.dmg" -nobrowse -readonly \
                | tail -1 | sed 's/^.*\(\/Volumes\/.*\)$/\1/')
          echo "mounted at $MNT"
          APP="$MNT/MacPuffin.app"

          for slice in MacOS/MacPuffin Resources/node Resources/mptrash; do
            ARCHS=$(lipo -archs "$APP/Contents/$slice")
            echo "$slice: $ARCHS"
            case "$ARCHS" in *arm64*)  ;; *) echo "missing arm64 in $slice";  exit 1 ;; esac
            case "$ARCHS" in *x86_64*) ;; *) echo "missing x86_64 in $slice"; exit 1 ;; esac
          done

          # A runtime that is signed but refuses to start is the failure mode
          # that actually reaches users.
          "$APP/Contents/Resources/node" --version
          codesign --verify --strict "$APP"
          hdiutil detach "$MNT"

      # A release that claims to be signed but is not is worse than an honest
      # unsigned one, so when a certificate was supplied the image must pass the
      # very check a user's Mac performs.
      - name: Prove the image will open without a prompt
        if: env.HAS_CERT == 'true'
        run: |
          DMG="$RUNNER_TEMP/dist/MacPuffin.dmg"

          # The ticket is stapled to the disk image, which is the thing that
          # gets downloaded. An app inside a stapled image carries no ticket of
          # its own, so asking the app about one always fails — the image is
          # what must be checked.
          xcrun stapler validate "$DMG"

          MNT=$(hdiutil attach "$DMG" -nobrowse -readonly \
                | tail -1 | sed 's/^.*\(\/Volumes\/.*\)$/\1/')

          # The verdict that matters: what Gatekeeper says about the app a user
          # drags out. "accepted" plus "Notarized Developer ID" means no prompt.
          ASSESS=$(spctl --assess --type execute --verbose "$MNT/MacPuffin.app" 2>&1)
          echo "$ASSESS"
          hdiutil detach "$MNT" >/dev/null

          case "$ASSESS" in
            *"Notarized Developer ID"*) ;;
            *) echo "not notarised — users would still be prompted"; exit 1 ;;
          esac
          case "$ASSESS" in
            *accepted*) ;;
            *) echo "Gatekeeper rejected the app"; exit 1 ;;
          esac
          echo "Gatekeeper accepts it — users see no prompt"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" \
            "$RUNNER_TEMP/dist/MacPuffin.dmg" \
            "$RUNNER_TEMP/dist/MacPuffin.dmg.sha256" \
            --title "MacPuffin $TAG" \
            --notes-file - <<'NOTES'
          ### Download

          **[MacPuffin.dmg](https://github.com/veraplot/MacPuffin/releases/latest/download/MacPuffin.dmg)** — universal (Apple Silicon + Intel), macOS 11 or newer.

          Drag it to Applications and open it. Everything it needs is inside the
          app; there is nothing else to install.

          Full capability list: [RELEASE_NOTES.md](https://github.com/veraplot/MacPuffin/blob/main/RELEASE_NOTES.md)

          Verify the download:

          ```
          shasum -a 256 -c MacPuffin.dmg.sha256
          ```
          NOTES
